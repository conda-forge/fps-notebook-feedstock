schema_version: 1

context:
  version: "0.10.5"

package:
  name: fps-notebook
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-notebook/fps_notebook-${{ version }}.tar.gz
    sha256: 12d7e93de19eccde6cc791bfc2c756d4cb4eee05073dec10460d586efd974ff1

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - fastapi-core
    - fps
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0
    - jupyverse-frontend >=0.1.0,<0.2.0
    - jupyverse-jupyterlab >=0.1.0,<0.2.0
    - jupyverse-lab >=0.3.0,<0.4.0
    - jupyverse-notebook >=0.1.1,<0.2.0
    - notebook-frontend >=7.4.2,<8.0.0
    - structlog

tests:
  - python:
      imports: fps_notebook
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/notebook
  summary: An FPS plugin for the Notebook API

extra:
  recipe-maintainers:
    - davidbrochart
